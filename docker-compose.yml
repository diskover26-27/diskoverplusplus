services:
  db:
    image: postgres:16
    container_name: diskover-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-diskover}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - diskover-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-diskover}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diskover-pgdata:
